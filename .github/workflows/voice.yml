# Builds flikka-voice (voice/), the helper that speaks in your own voices, and packs it for Flikka to download.
# A pushed voice-v* tag (matching voice/Cargo.toml's version) makes a draft GitHub release with the archive and its
# .sha256; drafts stay private until published. Run it by hand from the Actions tab to only build and keep the archive
# as an artifact. See DOCS/RELEASING.md.
name: flikka-voice

on:
  push:
    tags:
      - "voice-v*"
  workflow_dispatch:

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    # pyke's ONNX Runtime and Dawn builds need glibc 2.38 and GCC 13's libstdc++, so 24.04 is the oldest Ubuntu
    # that can link flikka-voice. Building here also keeps the binary's own glibc needs at 2.39 or below.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: voice

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "voice-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match voice/Cargo.toml's version ${version}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      # ort downloads ONNX Runtime and Dawn into ~/.cache/ort.pyke.io and links Dawn into target/release from there,
      # so that folder is cached with target/, or a cached build would leave the link pointing at nothing.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./voice -> target"
          cache-directories: ~/.cache/ort.pyke.io

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Build
        run: cargo build --release --locked

      - name: Third-party notices
        run: ./notices.sh

      - name: Pack and check
        run: ./package.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: flikka-voice
          path: voice/dist/flikka-voice-*
          if-no-files-found: error

      # Not marked latest, so Flikka's own release stays the one GitHub shows first.
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/flikka-voice-* --draft --latest=false \
            --title "flikka-voice ${GITHUB_REF_NAME#voice-v}" \
            --notes "The helper Flikka downloads to speak in your own voices (Chatterbox Nano). Linux x86_64, glibc 2.38 or newer. Flikka fetches this by itself; you don't need to download it."
