[package]
name = "flikka-cursor"
version = "0.1.0"
description = "Logs where the pointer is during a Wayland screen recording, so Flikka can draw it (or not) when it renders"
license = "Apache-2.0"
publish = false
edition = "2021"

[dependencies]
ashpd = { version = "0.14", default-features = false, features = ["screencast", "tokio"] }
libc = "0.2"
pipewire = "0.10.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "signal", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
